<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ChatZone — تسجيل الدخول</title>
<link rel="stylesheet" href="auth.css">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

    <div class="auth-screen">
        <button class="theme-toggle-btn" id="authThemeToggle" data-ar-aria="تبديل الوضع الداكن/الفاتح" data-en-aria="Toggle dark/light mode" aria-label="تبديل الوضع الداكن/الفاتح">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <button class="lang-toggle-btn" id="authLangToggle" data-ar-aria="تبديل اللغة إلى الإنجليزية" data-en-aria="Switch language to Arabic" aria-label="تبديل اللغة">
            <span data-ar="EN" data-en="AR">EN</span>
        </button>
        <div class="auth-top">
            <div class="mini-logo">
                <img src="chatzone.png" alt="ChatZone">
            </div>
        </div>

        <div class="auth-card">
            <h1 class="auth-title" data-ar="إيه إيميلك؟" data-en="What's your email?">إيه إيميلك؟</h1>
            <p class="auth-sub" data-ar="هنبعتلك كود تأكيد مكوّن من 6 أرقام عشان نتأكد إنه إنت" data-en="We'll send you a 6-digit code to make sure it's really you">هنبعتلك كود تأكيد مكوّن من 6 أرقام عشان نتأكد إنه إنت</p>

            <div class="field-group">
                <label for="emailInput" data-ar="البريد الإلكتروني" data-en="Email address">البريد الإلكتروني</label>
                <input type="email" id="emailInput" placeholder="example@mail.com" autocomplete="email" inputmode="email">
                <span class="field-error" id="emailError"></span>
            </div>

            <button class="primary-btn" id="sendCodeBtn">
                <span class="btn-label" data-ar="إرسال الكود" data-en="Send code">إرسال الكود</span>
                <span class="btn-spinner" id="btnSpinner"></span>
            </button>
        </div>

        <p class="auth-footnote" data-ar="بالمتابعة، إنت موافق على شروط استخدام ChatZone" data-en="By continuing, you agree to ChatZone's Terms of Use">بالمتابعة، إنت موافق على شروط استخدام ChatZone</p>
    </div>

    <script src="auth-theme.js"></script>
    <script src="auth-lang.js"></script>
    <script src="signup.js"></script>
</body>
</html>
