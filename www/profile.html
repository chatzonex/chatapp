<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ChatZone — اسمك</title>
<link rel="stylesheet" href="auth.css">
</head>
<body>

    <div class="auth-screen">
        <button class="theme-toggle-btn" id="authThemeToggle" data-ar-aria="تبديل الوضع الداكن/الفاتح" data-en-aria="Toggle dark/light mode" aria-label="تبديل الوضع الداكن/الفاتح">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <button class="lang-toggle-btn" id="authLangToggle" data-ar-aria="تبديل اللغة إلى الإنجليزية" data-en-aria="Switch language to Arabic" aria-label="تبديل اللغة">
            <span data-ar="EN" data-en="AR">EN</span>
        </button>
        <div class="auth-top">
            <div class="mini-logo">
                <img src="chatzone.png" alt="ChatZone">
            </div>
        </div>

        <div class="auth-card">
            <h1 class="auth-title" data-ar="إيه اسمك؟" data-en="What's your name?">إيه اسمك؟</h1>
            <p class="auth-sub" data-ar="هيظهر الاسم ده لباقي المستخدمين في ChatZone" data-en="This name will be shown to other users on ChatZone">هيظهر الاسم ده لباقي المستخدمين في ChatZone</p>

            <div class="field-group profile-avatar-field">
                <div class="profile-pic-picker" id="profilePicPicker">
                    <svg class="profile-pic-placeholder-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/>
                        <path d="M4 20c0-3.87 3.58-7 8-7s8 3.13 8 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                    <img class="profile-pic-preview" id="profilePicPreview" alt="" hidden>
                    <div class="profile-pic-camera">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 8a2 2 0 0 1 2-2h1.2l.9-1.4A1.5 1.5 0 0 1 9.35 4h5.3a1.5 1.5 0 0 1 1.25.6L16.8 6H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                            <circle cx="12" cy="13" r="3.2" stroke="currentColor" stroke-width="1.6"/>
                        </svg>
                    </div>
                </div>
                <input type="file" id="profilePicInput" accept="image/*" hidden>
                <p class="profile-pic-hint" data-ar="صورة البروفايل (اختياري)" data-en="Profile picture (optional)">صورة البروفايل (اختياري)</p>
            </div>

            <div class="field-group">
                <label for="nameInput" data-ar="الاسم" data-en="Name">الاسم</label>
                <input type="text" id="nameInput" placeholder="اكتب اسمك هنا" data-ar="اكتب اسمك هنا" data-en="Type your name here" autocomplete="name" maxlength="30">
                <span class="field-error" id="nameError"></span>
            </div>

            <button class="primary-btn" id="saveNameBtn">
                <span class="btn-label" data-ar="تأكيد" data-en="Confirm">تأكيد</span>
                <span class="btn-spinner" id="btnSpinner"></span>
            </button>

            <div class="dev-contact">
                <p class="dev-contact-text" data-ar="في مشكلة في كتابة اسمك أو حصل معاك أي خطأ؟" data-en="Trouble entering your name, or ran into an error?">في مشكلة في كتابة اسمك أو حصل معاك أي خطأ؟</p>
                <a href="#" id="contactDevBtn" class="dev-contact-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.2h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm5.8 14.16c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.12.11-1.81-.11-.42-.13-.95-.31-1.64-.6-2.88-1.24-4.76-4.14-4.9-4.33-.14-.19-1.17-1.56-1.17-2.98s.73-2.11 1-2.4c.24-.26.53-.33.71-.33.18 0 .35 0 .5.01.16.01.38-.06.6.46.24.57.8 1.98.87 2.12.07.14.12.31.02.5-.09.19-.14.31-.28.48-.14.16-.29.36-.42.48-.14.13-.28.27-.12.53.16.26.71 1.17 1.52 1.9 1.05.94 1.93 1.23 2.19 1.37.26.14.42.12.57-.07.16-.19.68-.79.86-1.06.18-.27.35-.22.6-.13.24.09 1.55.73 1.82.86.26.13.44.19.5.3.07.11.07.61-.17 1.29z"/>
                    </svg>
                    <span data-ar="تواصل مع المطور" data-en="Contact developer">تواصل مع المطور</span>
                </a>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="confirm-overlay" id="noPhotoOverlay">
        <div class="confirm-card">
            <h2 class="confirm-title" data-ar="نسيت ترفع صورة البروفايل" data-en="You haven't added a profile picture">نسيت ترفع صورة البروفايل</h2>
            <p class="confirm-sub" data-ar="تقدر تكمل من غيرها لو عايز، أو ترجع تضيفها دلوقتي." data-en="You can continue without one, or add it now.">تقدر تكمل من غيرها لو عايز، أو ترجع تضيفها دلوقتي.</p>
            <div class="confirm-actions">
                <button type="button" class="primary-btn" id="noPhotoUploadBtn" data-ar="ارفع صورة" data-en="Upload photo">ارفع صورة</button>
                <button type="button" class="secondary-btn" id="noPhotoContinueBtn" data-ar="كمّل من غيرها" data-en="Continue without it">كمّل من غيرها</button>
            </div>
        </div>
    </div>

    <script src="auth-theme.js"></script>
    <script src="auth-lang.js"></script>
    <script type="module" src="profile.js"></script>
</body>
</html>
