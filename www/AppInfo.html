<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="lang-flash-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ChatZone — معلومات التطبيق</title>
<script>
    if (!localStorage.getItem('cz_verified_email')) {
        window.location.replace('index.html');
    }
</script>
<script>
    (function () {
        try {
            var theme = localStorage.getItem('cz_theme') || 'dark';
            var lang = localStorage.getItem('cz_lang') || 'ar';
            var html = document.documentElement;
            html.lang = lang;
            html.dir = (lang === 'ar') ? 'rtl' : 'ltr';
            var moveToBody = function () {
                if (!document.body) return;
                if (theme === 'white') document.body.classList.add('theme-white');
            };
            if (document.body) {
                moveToBody();
            } else {
                new MutationObserver(function (_, obs) {
                    if (document.body) { moveToBody(); obs.disconnect(); }
                }).observe(document.documentElement, { childList: true });
            }
        } catch (e) {}
    })();
</script>
