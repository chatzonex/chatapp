<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ChatZone</title>
<style>
    :root {
        --bg: #0A0B0D;
        --text: #F2F5F4;
        --text-dim: #8A9691;
        --accent: #25D9A0;
        --glass: rgba(255,255,255,0.06);
        --glass-border: rgba(255,255,255,0.12);
    }
    * { box-sizing: border-box; }
    html, body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'Tajawal', 'Cairo', sans-serif;
    }
    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px 24px;
        min-height: 100vh;
        min-height: 100dvh;
    }
    .open-logo {
        width: 84px;
        height: 84px;
        border-radius: 22px;
        object-fit: cover;
        margin-bottom: 20px;
        box-shadow: 0 12px 34px rgba(0,0,0,0.35);
    }
    .open-title {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 8px;
    }
    .open-status {
        font-size: 14px;
        color: var(--text-dim);
        margin-bottom: 28px;
        line-height: 1.7;
        max-width: 320px;
    }
    .open-spinner {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 3px solid var(--glass-border);
        border-top-color: var(--text-dim);
        animation: openSpin 0.8s linear infinite;
        margin-bottom: 24px;
    }
    @keyframes openSpin { to { transform: rotate(360deg); } }

    .open-download-wrap {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        width: 100%;
        max-width: 320px;
    }
    .open-download-wrap.show { display: flex; }

    .open-download-btn {
        width: 100%;
        padding: 15px 20px;
        border-radius: 999px;
        border: none;
        background: var(--accent);
        color: #06110D;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: transform 0.15s ease;
    }
    .open-download-btn:active { transform: scale(0.96); }

    .open-retry-btn {
        width: 100%;
        padding: 13px 20px;
        border-radius: 999px;
        border: 1px solid var(--glass-border);
        background: var(--glass);
        color: var(--text-dim);
        font-size: 13.5px;
        font-weight: 700;
        cursor: pointer;
    }
</style>
</head>
<body>

    <img src="chatzone_AI_final_nobg_square.svg" alt="ChatZone" class="open-logo">
    <div class="open-title">ChatZone</div>

    <div id="openStatusArea">
        <div class="open-spinner" id="openSpinner"></div>
        <p class="open-status" id="openStatusText">جارِ فتح الشات في التطبيق...</p>
    </div>

    <div class="open-download-wrap" id="openDownloadWrap">
        <p class="open-status" style="margin-bottom:6px;">يبدو أن التطبيق غير مثبّت على جهازك. حمّله الأول عشان تقدر تفتح الشات.</p>
        <!-- ===== غيّر اللينك ده بلينك الميديا فاير بتاعك ===== -->
        <a class="open-download-btn" href="https://www.mediafire.com/file/example/ChatZone.apk/file" id="openDownloadBtn">
            تحميل التطبيق (APK)
        </a>
        <button class="open-retry-btn" id="openRetryBtn">جربت التحميل؟ افتح الشات تاني</button>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var email = params.get('to') || params.get('email') || '';

            var statusArea = document.getElementById('openStatusArea');
            var downloadWrap = document.getElementById('openDownloadWrap');
            var statusText = document.getElementById('openStatusText');
            var retryBtn = document.getElementById('openRetryBtn');

            if (!email) {
                statusArea.style.display = 'none';
                downloadWrap.classList.add('show');
                statusText = null;
                var msg = document.createElement('p');
                msg.className = 'open-status';
                msg.textContent = 'اللينك ده مش صحيح، محتاج يحتوي على إيميل الشخص.';
                downloadWrap.parentNode.insertBefore(msg, downloadWrap);
                return;
            }

            function buildDeepLink() {
                return 'chatzone://chat?email=' + encodeURIComponent(email);
            }

            function attemptOpenApp() {
                statusArea.style.display = 'flex';
                statusArea.style.flexDirection = 'column';
                statusArea.style.alignItems = 'center';
                downloadWrap.classList.remove('show');

                var didHide = false;
                var onVisibilityChange = function () {
                    if (document.hidden) didHide = true;
                };
                document.addEventListener('visibilitychange', onVisibilityChange);

                // محاولة فتح التطبيق عن طريق الـ custom scheme
                window.location.href = buildDeepLink();

                // بعد نص ثانية: لو الصفحة لسه ظاهرة (يعني التطبيق
                // معندوش حد يستقبل اللينك ده) بنعرض زرار التحميل.
                setTimeout(function () {
                    document.removeEventListener('visibilitychange', onVisibilityChange);
                    if (!didHide && !document.hidden) {
                        statusArea.style.display = 'none';
                        downloadWrap.classList.add('show');
                    }
                }, 1500);
            }

            retryBtn.addEventListener('click', attemptOpenApp);

            attemptOpenApp();
        })();
    </script>

</body>
</html>
