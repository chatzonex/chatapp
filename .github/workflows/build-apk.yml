name: Build ChatZone APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.CHATZONE_KEYSTORE_BASE64 }}" | base64 -d > android/app/chatzone-release.keystore

      - name: Build Signed Release APK
        env:
          CHATZONE_KEYSTORE_PATH: chatzone-release.keystore
          CHATZONE_KEYSTORE_PASSWORD: ${{ secrets.CHATZONE_KEYSTORE_PASSWORD }}
          CHATZONE_KEY_ALIAS: ${{ secrets.CHATZONE_KEY_ALIAS }}
          CHATZONE_KEY_PASSWORD: ${{ secrets.CHATZONE_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatZone-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
